request.onsuccess = () => {
  console.log("数据库打开成功");
  showAllIndexedDBs();
};

request.onerror = () => {
  console.error("数据库打开失败");
};

async function showAllIndexedDBs() {
  const output = document.getElementById('output');
  output.innerHTML = '';

  if (!indexedDB.databases) {
    output.innerHTML = '<p><b>indexedDB.databases()</b> is not supported in this browser.</p>';
    return;
  }

  const databases = await indexedDB.databases();
  console.log(`检测到 ${databases.length} 个数据库`);

  for (const { name, version } of databases) {
    const dbDiv = document.createElement('div');
    dbDiv.className = 'db';
    dbDiv.innerHTML = `<h2>📁 Database: <code>${name}</code> (v${version})</h2>`;
    output.appendChild(dbDiv);

    await new Promise((resolve, reject) => {
      const request = indexedDB.open(name, version);

      request.onsuccess = () => {
        const db = request.result;
        const stores = Array.from(db.objectStoreNames);

        if (stores.length === 0) {
          dbDiv.innerHTML += `<p>No object stores found.</p>`;
          resolve();
          return;
        }

        let pendingStores = stores.length;

        stores.forEach(storeName => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const getAllRequest = store.getAll();
          const getAllKeysRequest = store.getAllKeys();

          getAllRequest.onsuccess = () => {
            getAllKeysRequest.onsuccess = () => {
              const values = getAllRequest.result;
              const keys = getAllKeysRequest.result;

              const storeDiv = document.createElement('div');
              storeDiv.className = 'store';
              storeDiv.innerHTML = `<h3>📦 Store: <code>${storeName}</code></h3>`;

              values.forEach((value, index) => {
                const entry = document.createElement('div');
                entry.className = 'entry';

                const key = keys[index];
                entry.innerHTML = `<div class="key">🔑 ${JSON.stringify(key)}</div>`;

                if (typeof value === 'string' && value.startsWith('data:image/')) {
                  const img = document.createElement('img');
                  img.src = value;
                  img.className = 'image-preview';
                  entry.appendChild(img);
                }

                const valStr = (typeof value === 'object') ? JSON.stringify(value) : String(value);
                entry.innerHTML += `<div>📄 Value: <code>${valStr}</code></div>`;

                storeDiv.appendChild(entry);
              });

              dbDiv.appendChild(storeDiv);

              if (--pendingStores === 0) resolve();
            };
          };

          getAllRequest.onerror = getAllKeysRequest.onerror = () => {
            const errorDiv = document.createElement('div');
            errorDiv.textContent = `❌ Failed to read store "${storeName}".`;
            dbDiv.appendChild(errorDiv);
            if (--pendingStores === 0) resolve();
          };
        });
      };

      request.onerror = () => {
        dbDiv.innerHTML += `<p style="color:red;">❌ Failed to open database "${name}".</p>`;
        resolve();
      };
    });

    output.appendChild(document.createElement('hr'));
  }
}
</script>
