<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IndexedDB 图片查看器</title>
</head>
<body>
  <h1>图片阅读器</h1>
  <div id="container"></div>

  <script>
    const rrequest = indexedDB.open("SDB", 7);
    rrequest.onupgradeneeded = (e) => {
      e.target.result.createObjectStore("sttore", { autoIncrement: true });
    };

    rrequest.onsuccess = () => {
      const db = rrequest.result;

      // 显示已存图片
      const tx = db.transaction("sttore", "readonly");
      const store = tx.objectStore("sttore");
      const getAllReq = store.getAll();

      getAllReq.onsuccess = () => {
        const container = document.getElementById("container");
        getAllReq.result.forEach((data, i) => {
          // 判断是否是 ArrayBuffer（二进制）而不是字符串
          if (data instanceof ArrayBuffer) {
            const blob = new Blob([data], { type: "image/jpeg" }); // 你可以改成 image/png
            const url = URL.createObjectURL(blob);
            const img = document.createElement("img");
            img.src = url;
            img.style.maxWidth = "200px";
            img.style.margin = "10px";
            container.appendChild(img);
          } else {
            // 如果是旧数据（比如 base64 字符串），仍然兼容
            const img = document.createElement("img");
            img.src = data;
            img.style.maxWidth = "200px";
            img.style.margin = "10px";
            container.appendChild(img);
          }
        });
      };
    };
  </script>
</body>
</html>
