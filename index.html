<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IndexedDB 图片查看器</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    img { max-width: 200px; margin: 10px; border: 1px solid #ccc; }
    .entry { margin-bottom: 20px; padding: 10px; border-bottom: 1px dashed #aaa; }
    .meta { font-size: 0.9em; color: #444; }
  </style>
</head>
<body>
  <h1>📦 IndexedDB 图片阅读器</h1>
  <div id="container">正在加载...</div>

  <script>
    const dbRequest = indexedDB.open("SDB", 7);

    dbRequest.onupgradeneeded = (e) => {
      e.target.result.createObjectStore("sttore", { autoIncrement: true });
    };

    dbRequest.onsuccess = () => {
      const db = dbRequest.result;
      const tx = db.transaction("sttore", "readonly");
      const store = tx.objectStore("sttore");
      const cursorReq = store.openCursor();
      const container = document.getElementById("container");
      container.innerHTML = ""; // 清空“正在加载...”提示

      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const key = cursor.key;
          const value = cursor.value;
          const entry = document.createElement("div");
          entry.className = "entry";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `📌 键：${key} | 类型：${Object.prototype.toString.call(value).slice(8, -1)} | 大小：${value?.byteLength ?? value?.length ?? '未知'}`;
          entry.appendChild(meta);

          if (value instanceof ArrayBuffer) {
            const blob = new Blob([value], { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);
            const img = document.createElement("img");
            img.src = url;
            entry.appendChild(img);
          } else if (typeof value === "string" && value.startsWith("data:image/")) {
            const img = document.createElement("img");
            img.src = value;
            entry.appendChild(img);
          } else {
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(value, null, 2);
            entry.appendChild(pre);
          }

          container.appendChild(entry);
          cursor.continue();
        } else if (!container.hasChildNodes()) {
          container.textContent = "📭 数据库为空。";
        }
      };

      cursorReq.onerror = () => {
        container.textContent = "❌ 无法读取数据库内容。";
      };
    };

    dbRequest.onerror = () => {
      document.getElementById("container").textContent = "❌ 数据库打开失败。";
    };
  </script>
</body>
</html>
