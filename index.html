<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IndexedDB Viewer</title>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    h2, h3 { margin-top: 1em; }
    .db, .store, .entry { margin-bottom: 1em; }
    .image-preview { max-height: 100px; display: block; margin-top: 5px; }
    code { background: #f0f0f0; padding: 2px 4px; display: inline-block; }
    .key { font-weight: bold; }
    hr { border: none; border-top: 1px solid #ccc; margin: 20px 0; }
    #uploadBtn { margin: 10px 0; }
  </style>
</head>
<body>

<h1>IndexedDB Viewer (只读)</h1>
<div id="output"></div>

<!-- 上传按钮 -->
<input type="file" id="uploadBtn" accept="image/*">
<p>选择一张图片上传到 IndexedDB 中。</p>

<script>
console.log("开始读取 IndexedDB 数据库...");

async function showAllIndexedDBs() {
  const output = document.getElementById('output');
  output.innerHTML = '';

  if (!indexedDB.databases) {
    output.innerHTML = '<p><b>indexedDB.databases()</b> is not supported in this browser.</p>';
    return;
  }

  const databases = await indexedDB.databases();
  console.log(`检测到 ${databases.length} 个数据库`);

  for (const { name, version } of databases) {
    const dbDiv = document.createElement('div');
    dbDiv.className = 'db';
    dbDiv.innerHTML = `<h2>📁 Database: <code>${name}</code> (v${version})</h2>`;
    output.appendChild(dbDiv);

    await new Promise((resolve) => {
      const request = indexedDB.open(name, version);

      request.onsuccess = () => {
        console.log(`成功打开数据库: ${name}`);
        const db = request.result;
        const stores = Array.from(db.objectStoreNames);

        if (stores.length === 0) {
          dbDiv.innerHTML += `<p>No object stores found.</p>`;
          resolve();
          return;
        }

        let pendingStores = stores.length;

        stores.forEach(storeName => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const getAllRequest = store.getAll();
          const getAllKeysRequest = store.getAllKeys();

          getAllRequest.onsuccess = () => {
            getAllKeysRequest.onsuccess = () => {
              const values = getAllRequest.result;
              const keys = getAllKeysRequest.result;

              console.log(`读取对象存储 "${storeName}"：共 ${keys.length} 条记录`);

              const storeDiv = document.createElement('div');
              storeDiv.className = 'store';
              storeDiv.innerHTML = `<h3>📦 Store: <code>${storeName}</code></h3>`;

              values.forEach((value, index) => {
                const entry = document.createElement('div');
                entry.className = 'entry';

                const key = keys[index];
                entry.innerHTML = `<div class="key">🔑 ${JSON.stringify(key)}</div>`;

                // 判断是否为 ArrayBuffer（图片二进制）
                if (value instanceof ArrayBuffer) {
                  const blob = new Blob([value], { type: 'image/jpeg' }); // 或 image/png 视情况调整
                  const url = URL.createObjectURL(blob);
                  const img = document.createElement('img');
                  img.src = url;
                  img.className = 'image-preview';
                  entry.appendChild(img);
                } else if (typeof value === 'string' && value.startsWith('data:image/')) {
                  const img = document.createElement('img');
                  img.src = value;
                  img.className = 'image-preview';
                  entry.appendChild(img);
                }

                const valStr = (typeof value === 'object' && !(value instanceof ArrayBuffer))
                  ? JSON.stringify(value)
                  : String(value);
                entry.innerHTML += `<div>📄 Value: <code>${valStr}</code></div>`;

                storeDiv.appendChild(entry);
              });

              dbDiv.appendChild(storeDiv);

              if (--pendingStores === 0) resolve();
            };
          };

          getAllRequest.onerror = getAllKeysRequest.onerror = () => {
            console.error(`❌ 无法读取对象存储 "${storeName}"`);
            const errorDiv = document.createElement('div');
            errorDiv.textContent = `❌ Failed to read store "${storeName}".`;
            dbDiv.appendChild(errorDiv);
            if (--pendingStores === 0) resolve();
          };
        });
      };

      request.onerror = () => {
        console.error(`❌ 无法打开数据库 "${name}"`);
        dbDiv.innerHTML += `<p style="color:red;">❌ Failed to open database "${name}".</p>`;
        resolve();
      };
    });

    output.appendChild(document.createElement('hr'));
  }
}

// 处理上传图片并存储到 IndexedDB
document.getElementById("uploadBtn").onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  
  reader.onload = () => {
    const rrequest = indexedDB.open("SDB", 8);

    rrequest.onupgradeneeded = (e) => {
      const db = e.target.result;
      // 创建对象存储 'store' 如果它不存在
      if (!db.objectStoreNames.contains("store")) {
        db.createObjectStore("store", { autoIncrement: true });
      }
    };

    rrequest.onsuccess = () => {
      const db = rrequest.result;
      const tx = db.transaction("store", "readwrite");
      const store = tx.objectStore("store");
      store.put(reader.result); // 存储图片的 ArrayBuffer 数据
      console.log("✅ 成功写入 ArrayBuffer 数据");
    };
    
    rrequest.onerror = () => {
      console.error("❌ 无法打开 IndexedDB 数据库");
    };
  };

  reader.readAsArrayBuffer(file); // 读取文件为 ArrayBuffer
};

// 调用函数读取数据库
showAllIndexedDBs();
</script>

</body>
</html>
